{% extends "base.html" %}

{% block content %}
<div class="tally-master-screen-split">
    <!-- Left Half: GST Classification Form (Matching Video Frame 32) -->
    <div class="tally-master-pane" style="max-width: 540px;">
        <form method="POST" action="/reports/gst" id="masterForm" onsubmit="event.preventDefault(); showAcceptModal();">
            <div class="tally-section-title">GST Classification Details</div>

            <div class="tally-field-row">
                <span class="tally-lbl">Name</span>
                <span class="tally-colon">:</span>
                <input type="text" name="name" class="tally-fld-input" required autofocus placeholder="e.g. Standard Taxable Goods 18%">
            </div>

            <div style="height: 20px;"></div>

            <div class="tally-field-row">
                <span class="tally-lbl" style="width: 200px;">HSN/SAC</span>
                <span class="tally-colon">:</span>
                <input type="text" name="hsn_sac" class="tally-fld-input" placeholder="e.g. 8471">
            </div>
            <div class="tally-field-row">
                <span class="tally-lbl" style="width: 200px;">Taxability</span>
                <span class="tally-colon">:</span>
                <select name="taxability" class="tally-fld-select">
                    <option value="Taxable" selected>♦ Taxable</option>
                    <option value="Exempt">♦ Exempt</option>
                    <option value="Nil Rated">♦ Nil Rated</option>
                </select>
            </div>
            <div class="tally-field-row">
                <span class="tally-lbl" style="width: 200px;">Integrated Tax</span>
                <span class="tally-colon">:</span>
                <input type="number" step="0.01" name="igst_rate" value="18.0" class="tally-fld-input" style="width: 80px;" oninput="updateHalfTaxes(this.value)">
                <span style="margin-left: 6px;">%</span>
            </div>
            <div class="tally-field-row">
                <span class="tally-lbl" style="width: 200px;">Central Tax</span>
                <span class="tally-colon">:</span>
                <span id="cgst_disp" style="font-weight: 600; padding: 2px 6px;">9.00</span> %
            </div>
            <div class="tally-field-row">
                <span class="tally-lbl" style="width: 200px;">State Tax</span>
                <span class="tally-colon">:</span>
                <span id="sgst_disp" style="font-weight: 600; padding: 2px 6px;">9.00</span> %
            </div>

            <div style="margin-top: 35px; display: flex; gap: 10px;">
                <button type="submit" class="tally-btn-save">Accept (Enter)</button>
                <a href="/reports/gst" class="tally-btn-cancel">Quit (Esc)</a>
            </div>
        </form>
    </div>

    <!-- Right Half: Dimmed Gateway -->
    <div class="tally-dimmed-pane">
        <div style="font-size: 13px; color: #55728a; text-align: center; margin-top: 40px; font-weight: 600;">
            Gateway of Tally (Press Esc to Cancel)
        </div>
    </div>
</div>

<!-- Authentic Accept Dialog -->
<div id="acceptModal" class="tally-modal" style="display:none;">
    <div class="tally-dialog">
        <div class="dialog-title">Accept ?</div>
        <div class="dialog-body">Yes or No</div>
        <div class="dialog-actions">
            <button class="tally-dialog-btn default" id="btnYes" onclick="document.getElementById('masterForm').submit();"><u>Y</u>es</button>
            <button class="tally-dialog-btn" onclick="hideAcceptModal();"><u>N</u>o</button>
        </div>
    </div>
</div>

<script>
function updateHalfTaxes(val) {
    let rate = parseFloat(val) || 0;
    let half = (rate / 2.0).toFixed(2);
    document.getElementById('cgst_disp').innerText = half;
    document.getElementById('sgst_disp').innerText = half;
}
function showAcceptModal() {
    document.getElementById('acceptModal').style.display = 'flex';
    document.getElementById('btnYes').focus();
}
function hideAcceptModal() {
    document.getElementById('acceptModal').style.display = 'none';
}
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
        showAcceptModal();
    }
    if (document.getElementById('acceptModal').style.display === 'flex') {
        if (e.key === 'y' || e.key === 'Y' || e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('masterForm').submit();
        } else if (e.key === 'n' || e.key === 'N' || e.key === 'Escape') {
            e.preventDefault();
            hideAcceptModal();
        }
    }
});
</script>
{% endblock %}
