{% extends "base.html" %}

{% block content %}
<div class="tally-card" style="max-width: 850px; margin: 0 auto;">
    <div class="tally-card-header">
        <span>Create Financial Budget Master</span>
        <a href="/budgets" class="tally-btn" style="padding: 4px 10px; text-decoration: none;">Back</a>
    </div>
    <div class="tally-card-body" style="padding: 20px;">
        <form method="POST" action="/budgets/create">
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label class="form-label">Budget Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. FY 2026-27 Marketing & Admin Budget" required>
                </div>
                <div class="form-group">
                    <label class="form-label">From Date</label>
                    <input type="date" name="from_date" class="form-control" value="{{ from_date }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">To Date</label>
                    <input type="date" name="to_date" class="form-control" value="{{ to_date }}" required>
                </div>
            </div>

            <h4 style="color:var(--tally-yellow); margin-bottom: 10px;">Ledger Allocations</h4>
            <table class="tally-table" style="margin-bottom: 15px;">
                <thead>
                    <tr>
                        <th>Expense / Account Ledger</th>
                        <th style="width: 220px; text-align: right;">Allocated Budget Amount (₹)</th>
                        <th style="width: 50px;"></th>
                    </tr>
                </thead>
                <tbody id="allocBody">
                    <tr>
                        <td>
                            <select name="ledger_id[]" class="form-control" required>
                                <option value="">-- Select Ledger --</option>
                                {% for l in ledgers %}
                                <option value="{{ l.id }}">{{ l.name }} ({{ l.group_name }})</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <input type="number" step="0.01" name="allocated_amount[]" class="form-control alloc-amount" value="0.00" min="0" required style="text-align: right;" onchange="updateTotalBudget()">
                        </td>
                        <td><button type="button" class="tally-btn" style="color:#ff6b6b; padding:2px 8px;" onclick="removeAllocRow(this)">✕</button></td>
                    </tr>
                </tbody>
            </table>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <button type="button" class="tally-btn" onclick="addAllocRow()">+ Add Ledger Allocation</button>
                <div style="font-size: 15px;">
                    Total Budget: <strong id="dispTotalBudget" style="color:var(--tally-yellow);">₹0.00</strong>
                </div>
            </div>

            <div style="display:flex; justify-content: flex-end; gap: 10px;">
                <a href="/budgets" class="tally-btn" style="text-decoration:none;">Cancel</a>
                <button type="submit" class="tally-btn tally-btn-primary">Save Budget</button>
            </div>
        </form>
    </div>
</div>

<script>
function updateTotalBudget() {
    let tot = 0;
    document.querySelectorAll('.alloc-amount').forEach(inp => {
        tot += (parseFloat(inp.value) || 0);
    });
    document.getElementById('dispTotalBudget').innerText = '₹' + tot.toFixed(2);
}

function addAllocRow() {
    const tbody = document.getElementById('allocBody');
    const firstRow = tbody.querySelector('tr');
    const clone = firstRow.cloneNode(true);
    clone.querySelector('select').selectedIndex = 0;
    clone.querySelector('input').value = "10000.00";
    tbody.appendChild(clone);
    updateTotalBudget();
}

function removeAllocRow(btn) {
    const tbody = document.getElementById('allocBody');
    if (tbody.querySelectorAll('tr').length > 1) {
        btn.closest('tr').remove();
        updateTotalBudget();
    }
}
</script>
{% endblock %}
