{% extends "base.html" %}

{% block content %}
<div class="tally-card" style="max-width: 800px; margin: 0 auto;">
    <div class="tally-card-header">
        <span>TDS Expense Voucher Entry (Statutory Double Entry)</span>
        <a href="/statutory/tds" class="tally-btn" style="padding: 4px 10px; text-decoration: none;">Back</a>
    </div>
    <div class="tally-card-body" style="padding: 20px;">
        <form method="POST" action="/statutory/tds/entry">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label class="form-label">Voucher Date</label>
                    <input type="date" name="voucher_date" class="form-control" value="{{ today }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">TDS Section Code</label>
                    <select name="section_code" id="sectionSelect" class="form-control" required onchange="recalculateTds()">
                        {% for s in sections %}
                        <option value="{{ s.section_code }}" data-rate="{{ s.rate_others }}">
                            {{ s.section_code }} - {{ s.description }} ({{ s.rate_others }}%)
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label class="form-label">Expense Ledger (Debit)</label>
                    <select name="expense_ledger_id" class="form-control" required>
                        <option value="">-- Select Expense Ledger --</option>
                        {% for l in expense_ledgers %}
                        <option value="{{ l.id }}">{{ l.name }} ({{ l.group_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Party / Vendor Ledger (Credit Net)</label>
                    <select name="party_ledger_id" id="partySelect" class="form-control" required onchange="recalculateTds()">
                        <option value="">-- Select Vendor / Contractor --</option>
                        {% for l in party_ledgers %}
                        <option value="{{ l.id }}" data-pan="{{ l.pan or '' }}">{{ l.name }} {% if l.pan %}(PAN: {{ l.pan }}){% else %}(NO PAN - 20% Higher Deduction){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label class="form-label">TDS Duties Ledger (Credit Tax)</label>
                    <select name="tds_ledger_id" class="form-control" required>
                        <option value="">-- Select TDS Duties Ledger --</option>
                        {% for l in tax_ledgers %}
                        <option value="{{ l.id }}" {% if 'TDS' in l.name or 'Duties' in l.group_name %}selected{% endif %}>{{ l.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Gross Expense Amount (₹)</label>
                    <input type="number" step="0.01" name="gross_amount" id="grossAmount" class="form-control" value="50000.00" min="1.0" required onchange="recalculateTds()" onkeyup="recalculateTds()">
                </div>
            </div>

            <div style="background: rgba(0,0,0,0.25); border: 1px solid var(--tally-border); border-radius: 4px; padding: 15px; margin-bottom: 20px;">
                <div style="color:var(--tally-yellow); font-size:12px; font-weight:600; text-transform:uppercase; margin-bottom:10px;">Double-Entry Posting Preview</div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span>Dr Expense Account (Gross Amount):</span>
                    <strong id="previewDr">₹50,000.00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; color:var(--tally-cyan);">
                    <span id="previewTdsLabel">Cr TDS Payable u/s (10%):</span>
                    <strong id="previewTds">₹5,000.00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; color:#2ecc71;">
                    <span>Cr Party Ledger (Net Payable):</span>
                    <strong id="previewNet">₹45,000.00</strong>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label">Narration</label>
                <input type="text" name="narration" class="form-control" placeholder="Expense booking with statutory TDS deduction...">
            </div>

            <div style="display:flex; justify-content: flex-end; gap: 10px;">
                <a href="/statutory/tds" class="tally-btn" style="text-decoration:none;">Cancel</a>
                <button type="submit" class="tally-btn tally-btn-primary">Post Balanced Voucher</button>
            </div>
        </form>
    </div>
</div>

<script>
function recalculateTds() {
    const gross = parseFloat(document.getElementById('grossAmount').value) || 0;
    const secSelect = document.getElementById('sectionSelect');
    const secOpt = secSelect.options[secSelect.selectedIndex];
    const stdRate = parseFloat(secOpt.getAttribute('data-rate') || 10);

    const partySelect = document.getElementById('partySelect');
    let pan = "";
    if (partySelect.selectedIndex >= 0) {
        pan = partySelect.options[partySelect.selectedIndex].getAttribute('data-pan') || "";
    }

    let rate = stdRate;
    let label = `Cr TDS Payable u/s ${secSelect.value} (${rate}%):`;
    if (!pan || pan.trim().length !== 10) {
        rate = 20.0;
        label = `Cr TDS Payable u/s 206AA (Higher 20% - No Valid PAN):`;
    }

    const tdsAmt = Math.round((gross * rate / 100) * 100) / 100;
    const netAmt = Math.round((gross - tdsAmt) * 100) / 100;

    document.getElementById('previewDr').innerText = '₹' + gross.toFixed(2);
    document.getElementById('previewTdsLabel').innerText = label;
    document.getElementById('previewTds').innerText = '₹' + tdsAmt.toFixed(2);
    document.getElementById('previewNet').innerText = '₹' + netAmt.toFixed(2);
}
recalculateTds();
</script>
{% endblock %}
